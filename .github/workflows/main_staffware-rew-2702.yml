# Deploy to Azure Web App - staffware-rew-2702 on every push to main (or by hand from the Actions tab).
# The build and deploy steps live in azure-build-deploy.yml.
# If the new version fails to deploy or the site does not come back healthy, the previous version of main
# is deployed again automatically (the "rollback" job). To go back to any older version by hand, use the
# "Roll back Azure deployment" workflow.
# Sign-in uses the identity that Azure's Deployment Center created (no password stored).
# App settings (database login, session secret, ...) live in Azure, not in the repo.

name: Build and deploy Node.js app to Azure Web App - staffware-rew-2702

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/azure-build-deploy.yml
    with:
      ref: ${{ github.sha }}
      label: deploy
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # Runs only when the deploy above failed. Re-deploys the commit that was on main before this push.
  rollback:
    needs: deploy
    if: ${{ failure() && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
    uses: ./.github/workflows/azure-build-deploy.yml
    with:
      ref: ${{ github.event.before }}
      label: rollback
    secrets: inherit
    permissions:
      id-token: write
      contents: read
